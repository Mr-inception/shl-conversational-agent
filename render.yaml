services:
  - type: web
    name: shl-recommender
    runtime: python
    rootDir: shl-recommender
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SHL_SKIP_STARTUP_ENSURE
        value: "1"
